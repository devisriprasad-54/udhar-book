<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Udhar Book</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --green: #16a34a; --green-light: #dcfce7; --green-dark: #14532d;
    --red: #dc2626; --red-light: #fee2e2; --red-dark: #7f1d1d;
    --bg: #f0fdf4; --card: #ffffff; --border: #e5e7eb;
    --text: #111827; --muted: #6b7280; --accent: #15803d;
  }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; max-width: 480px; margin: 0 auto; position: relative; }

  /* TOP BAR */
  .topbar { background: var(--green); padding: 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  .topbar-title { color: white; font-size: 20px; font-weight: 700; flex: 1; }
  .topbar-total { background: rgba(255,255,255,0.2); color: white; padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  /* SEARCH BAR */
  .search-wrap { padding: 12px 16px; background: white; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
  .search-input { flex: 1; border: 1.5px solid var(--border); border-radius: 24px; padding: 10px 16px; font-size: 15px; outline: none; background: #f9fafb; }
  .search-input:focus { border-color: var(--green); background: white; }
  .import-btn { background: var(--green); color: white; border: none; border-radius: 24px; padding: 10px 14px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }

  /* CONTACT LIST */
  .contact-list { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .contact-card { background: var(--card); border-radius: 14px; border: 1px solid var(--border); padding: 14px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: box-shadow 0.15s, transform 0.1s; active: scale(0.98); }
  .contact-card:active { transform: scale(0.98); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  .avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; flex-shrink: 0; }
  .contact-info { flex: 1; min-width: 0; }
  .contact-name { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contact-phone { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .contact-balance { text-align: right; flex-shrink: 0; }
  .balance-amount { font-weight: 700; font-size: 16px; }
  .balance-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .owed { color: var(--red); }
  .clear { color: var(--green); }

  /* EMPTY STATE */
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-icon { font-size: 64px; margin-bottom: 16px; }
  .empty h3 { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 8px; }

  /* ADD FAB */
  .fab { position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px; border-radius: 50%; background: var(--green); color: white; border: none; font-size: 30px; cursor: pointer; box-shadow: 0 4px 16px rgba(22,163,74,0.4); display: flex; align-items: center; justify-content: center; z-index: 200; transition: transform 0.1s; }
  .fab:active { transform: scale(0.93); }

  /* MODAL OVERLAY */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: white; border-radius: 24px 24px 0 0; width: 100%; max-width: 480px; padding: 20px 20px 36px; max-height: 90vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.25s cubic-bezier(.4,0,.2,1); }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-handle { width: 40px; height: 4px; background: #d1d5db; border-radius: 2px; margin: 0 auto 20px; }
  .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }

  /* FORM */
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-input { width: 100%; border: 1.5px solid var(--border); border-radius: 12px; padding: 12px 14px; font-size: 16px; outline: none; background: #f9fafb; }
  .form-input:focus { border-color: var(--green); background: white; }
  .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .type-btn { border: 2px solid var(--border); border-radius: 12px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; background: white; color: var(--muted); text-align: center; transition: all 0.15s; }
  .type-btn.due.active { border-color: var(--red); background: var(--red-light); color: var(--red-dark); }
  .type-btn.paid.active { border-color: var(--green); background: var(--green-light); color: var(--green-dark); }
  .submit-btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 17px; font-weight: 700; color: white; cursor: pointer; margin-top: 8px; transition: transform 0.1s; }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn.due { background: var(--red); }
  .submit-btn.paid { background: var(--green); }

  /* DETAIL PAGE */
  #detail-page { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 150; overflow-y: auto; max-width: 480px; margin: 0 auto; }
  #detail-page.open { display: block; }
  .detail-header { background: white; border-bottom: 1px solid var(--border); padding: 16px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 10; }
  .detail-avatar { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; }
  .detail-name { font-size: 18px; font-weight: 700; }
  .detail-phone { font-size: 13px; color: var(--muted); }
  .balance-banner { margin: 16px; border-radius: 16px; padding: 18px; text-align: center; }
  .balance-banner.owed { background: var(--red-light); }
  .balance-banner.clear { background: var(--green-light); }
  .balance-banner .amount { font-size: 36px; font-weight: 800; }
  .balance-banner .amount.owed { color: var(--red); }
  .balance-banner .amount.clear { color: var(--green); }
  .balance-banner .label { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 16px 16px; }
  .action-btn { padding: 14px; border-radius: 14px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; transition: transform 0.1s; }
  .action-btn:active { transform: scale(0.97); }
  .action-btn.due { background: var(--red-light); color: var(--red-dark); }
  .action-btn.paid { background: var(--green-light); color: var(--green-dark); }
  .sms-btn { display: block; margin: 0 16px 16px; padding: 14px; border-radius: 14px; background: #1d4ed8; color: white; text-align: center; font-size: 15px; font-weight: 700; text-decoration: none; }
  .txn-list { margin: 0 16px; display: flex; flex-direction: column; gap: 8px; padding-bottom: 100px; }
  .txn-card { background: white; border-radius: 12px; border: 1px solid var(--border); padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
  .txn-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .txn-dot.due { background: var(--red); }
  .txn-dot.paid { background: var(--green); }
  .txn-info { flex: 1; }
  .txn-note { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .txn-date { font-size: 12px; color: var(--muted); }
  .txn-amount { font-weight: 700; font-size: 16px; }
  .txn-amount.due { color: var(--red); }
  .txn-amount.paid { color: var(--green); }
  .section-title { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; margin: 0 16px 8px; }

  .delete-btn { background: none; border: none; color: #d1d5db; font-size: 18px; cursor: pointer; padding: 4px; }
  .delete-btn:active { color: var(--red); }
</style>
</head>
<body>

<!-- MAIN PAGE -->
<div id="main-page">
  <div class="topbar">
    <div class="topbar-title">📒 Udhar Book</div>
    <div class="topbar-total" id="net-summary">Loading...</div>
  </div>
  <div class="search-wrap">
    <input class="search-input" id="search-input" type="search" placeholder="Search contacts..." autocomplete="off">
    <button class="import-btn" onclick="importContacts()">+ Contact</button>
  </div>
  <div class="contact-list" id="contact-list"></div>
</div>

<!-- DETAIL PAGE -->
<div id="detail-page">
  <div class="detail-header">
    <button class="back-btn" onclick="closePage()" style="background:#f3f4f6;color:#374151;">←</button>
    <div class="detail-avatar" id="det-avatar"></div>
    <div>
      <div class="detail-name" id="det-name"></div>
      <div class="detail-phone" id="det-phone"></div>
    </div>
  </div>
  <div class="balance-banner" id="det-banner">
    <div class="amount" id="det-amount"></div>
    <div class="label" id="det-label"></div>
  </div>
  <div class="action-row">
    <button class="action-btn due" onclick="openAddModal('due')">+ Add Due</button>
    <button class="action-btn paid" onclick="openAddModal('paid')">✓ Add Paid</button>
  </div>
  <a class="sms-btn" id="sms-link" href="#">📱 Send SMS Update</a>
  <div class="section-title">Transaction History</div>
  <div class="txn-list" id="txn-list"></div>
</div>

<!-- ADD TRANSACTION MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Add Transaction</div>
    <div class="form-group">
      <label class="form-label">Type</label>
      <div class="type-toggle">
        <button class="type-btn due active" id="type-due" onclick="setType('due')">🔴 Due (Owes You)</button>
        <button class="type-btn paid" id="type-paid" onclick="setType('paid')">🟢 Paid (You Got)</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Amount (₹)</label>
      <input class="form-input" id="txn-amount" type="number" placeholder="0" inputmode="numeric">
    </div>
    <div class="form-group">
      <label class="form-label">Note (optional)</label>
      <input class="form-input" id="txn-note" type="text" placeholder="e.g. Grocery, Loan...">
    </div>
    <button class="submit-btn due" id="submit-btn" onclick="submitTransaction()">Add Transaction</button>
  </div>
</div>

<!-- FAB -->
<button class="fab" id="fab" onclick="openAddModal('due')">+</button>

<script>
let contacts = JSON.parse(localStorage.getItem('udhar_contacts') || '[]');
let currentContactId = null;
let currentType = 'due';

function save() { localStorage.setItem('udhar_contacts', JSON.stringify(contacts)); }

function getBalance(contact) {
  return (contact.transactions || []).reduce((sum, t) => t.type === 'paid' ? sum - t.amount : sum + t.amount, 0);
}

function getInitials(name) {
  return name.trim().split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
}

const COLORS = ['#16a34a','#2563eb','#7c3aed','#db2777','#ea580c','#0891b2','#65a30d'];
function getColor(name) { let h = 0; for (let c of name) h = (h * 31 + c.charCodeAt(0)) % COLORS.length; return COLORS[h]; }

function formatDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function renderContactList(filter = '') {
  const list = document.getElementById('contact-list');
  const filtered = contacts.filter(c => c.name.toLowerCase().includes(filter.toLowerCase()) || (c.phone && c.phone.includes(filter)));
  let totalDue = 0, totalPaid = 0;
  contacts.forEach(c => { const b = getBalance(c); if (b > 0) totalDue += b; else totalPaid += Math.abs(b); });

  document.getElementById('net-summary').textContent = `Due ₹${Math.round(totalDue).toLocaleString('en-IN')}`;

  if (!contacts.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">📖</div><h3>No contacts yet</h3><p>Tap "+ Contact" to add someone from your phone or add manually.</p></div>`;
    return;
  }
  if (!filtered.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><h3>No results</h3><p>No contacts match your search.</p></div>`;
    return;
  }

  list.innerHTML = filtered.map(c => {
    const bal = getBalance(c);
    const color = getColor(c.name);
    const balText = bal === 0 ? '₹0' : `₹${Math.abs(bal).toLocaleString('en-IN')}`;
    const balClass = bal > 0 ? 'owed' : 'clear';
    const balLabel = bal > 0 ? 'owes you' : bal < 0 ? 'you owe' : 'settled';
    return `<div class="contact-card" onclick="openContact('${c.id}')">
      <div class="avatar" style="background:${color}22;color:${color}">${getInitials(c.name)}</div>
      <div class="contact-info">
        <div class="contact-name">${c.name}</div>
        <div class="contact-phone">${c.phone || 'No phone'}</div>
      </div>
      <div class="contact-balance">
        <div class="balance-amount ${balClass}">${balText}</div>
        <div class="balance-label">${balLabel}</div>
      </div>
    </div>`;
  }).join('');
}

function openContact(id) {
  currentContactId = id;
  const c = contacts.find(x => x.id === id);
  if (!c) return;
  const bal = getBalance(c);
  const color = getColor(c.name);

  document.getElementById('det-avatar').textContent = getInitials(c.name);
  document.getElementById('det-avatar').style.background = color + '22';
  document.getElementById('det-avatar').style.color = color;
  document.getElementById('det-name').textContent = c.name;
  document.getElementById('det-phone').textContent = c.phone || 'No phone saved';

  const banner = document.getElementById('det-banner');
  const amountEl = document.getElementById('det-amount');
  const labelEl = document.getElementById('det-label');
  const absbal = Math.abs(bal);

  amountEl.textContent = `₹${absbal.toLocaleString('en-IN')}`;
  if (bal > 0) {
    banner.className = 'balance-banner owed';
    amountEl.className = 'amount owed';
    labelEl.textContent = `${c.name} owes you`;
  } else if (bal < 0) {
    banner.className = 'balance-banner';
    amountEl.className = 'amount';
    amountEl.style.color = '#b45309';
    labelEl.textContent = `You owe ${c.name}`;
  } else {
    banner.className = 'balance-banner clear';
    amountEl.className = 'amount clear';
    labelEl.textContent = 'All settled!';
  }

  // SMS link
  const smsBody = `Hi ${c.name}, your current balance with us is ₹${absbal.toLocaleString('en-IN')} (${bal > 0 ? 'you owe us' : bal < 0 ? 'we owe you' : 'settled'}). Please contact us for details.`;
  const smsHref = c.phone ? `sms:${c.phone}?body=${encodeURIComponent(smsBody)}` : '#';
  document.getElementById('sms-link').href = smsHref;
  if (!c.phone) document.getElementById('sms-link').onclick = (e) => { e.preventDefault(); alert('No phone number saved for this contact.'); };

  const txnList = document.getElementById('txn-list');
  const txns = [...(c.transactions || [])].reverse();
  if (!txns.length) {
    txnList.innerHTML = '<div style="text-align:center;padding:30px;color:#9ca3af;">No transactions yet</div>';
  } else {
    txnList.innerHTML = txns.map((t, i) => `
      <div class="txn-card">
        <div class="txn-dot ${t.type}"></div>
        <div class="txn-info">
          <div style="font-weight:600;font-size:15px">${t.type === 'due' ? 'Due added' : 'Payment received'}</div>
          ${t.note ? `<div class="txn-note">${t.note}</div>` : ''}
          <div class="txn-date">${formatDate(t.ts)}</div>
        </div>
        <div class="txn-amount ${t.type}">₹${t.amount.toLocaleString('en-IN')}</div>
        <button class="delete-btn" onclick="deleteTxn('${c.id}', ${c.transactions.length - 1 - i})" title="Delete">✕</button>
      </div>`).join('');
  }

  document.getElementById('detail-page').classList.add('open');
  document.getElementById('fab').style.display = 'flex';
  document.getElementById('fab').onclick = () => openAddModal('due');
}

function closePage() {
  document.getElementById('detail-page').classList.remove('open');
  document.getElementById('fab').onclick = () => openAddModal('due');
  renderContactList(document.getElementById('search-input').value);
}

function deleteTxn(contactId, txnIndex) {
  if (!confirm('Delete this transaction?')) return;
  const c = contacts.find(x => x.id === contactId);
  if (c) { c.transactions.splice(txnIndex, 1); save(); openContact(contactId); }
}

function openAddModal(type) {
  if (!currentContactId && document.getElementById('detail-page').classList.contains('open')) return;
  setType(type);
  document.getElementById('txn-amount').value = '';
  document.getElementById('txn-note').value = '';
  const overlay = document.getElementById('modal-overlay');
  overlay.classList.add('open');
  setTimeout(() => document.getElementById('txn-amount').focus(), 300);
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

function setType(type) {
  currentType = type;
  document.getElementById('type-due').className = 'type-btn due' + (type === 'due' ? ' active' : '');
  document.getElementById('type-paid').className = 'type-btn paid' + (type === 'paid' ? ' active' : '');
  const btn = document.getElementById('submit-btn');
  btn.className = `submit-btn ${type}`;
  btn.textContent = type === 'due' ? '🔴 Add Due Amount' : '🟢 Add Payment';
}

function submitTransaction() {
  const amount = parseFloat(document.getElementById('txn-amount').value);
  const note = document.getElementById('txn-note').value.trim();
  if (!amount || amount <= 0) { alert('Please enter a valid amount.'); return; }

  let contactId = currentContactId;

  // If no contact is open, it means we need to pick or add one
  if (!contactId) {
    const name = prompt('Enter contact name:');
    if (!name) return;
    const phone = prompt('Enter phone number (for SMS):');
    const id = Date.now().toString();
    const newContact = { id, name: name.trim(), phone: phone?.trim() || '', transactions: [] };
    contacts.unshift(newContact);
    contactId = id;
    currentContactId = id;
  }

  const c = contacts.find(x => x.id === contactId);
  if (!c.transactions) c.transactions = [];
  c.transactions.push({ type: currentType, amount, note, ts: Date.now() });
  save();

  closeModal();

  // Send SMS
  if (c.phone) {
    const bal = getBalance(c);
    const absbal = Math.abs(bal);
    const msg = `Hi ${c.name}, ₹${amount.toLocaleString('en-IN')} ${currentType === 'due' ? 'due added' : 'payment recorded'}. Total balance: ₹${absbal.toLocaleString('en-IN')} (${bal > 0 ? 'you owe us' : bal < 0 ? 'we owe you' : 'settled'}). - Udhar Book`;
    const smsLink = document.createElement('a');
    smsLink.href = `sms:${c.phone}?body=${encodeURIComponent(msg)}`;
    smsLink.click();
  }

  if (document.getElementById('detail-page').classList.contains('open')) {
    openContact(contactId);
  } else {
    renderContactList();
  }
}

async function importContacts() {
  if ('contacts' in navigator && 'ContactsManager' in window) {
    try {
      const props = ['name', 'tel'];
      const opts = { multiple: true };
      const results = await navigator.contacts.select(props, opts);
      if (!results.length) return;
      let added = 0;
      results.forEach(r => {
        const name = r.name?.[0] || 'Unknown';
        const phone = r.tel?.[0] || '';
        const exists = contacts.find(c => c.name.toLowerCase() === name.toLowerCase() || (phone && c.phone === phone));
        if (!exists) {
          contacts.push({ id: Date.now().toString() + Math.random(), name, phone, transactions: [] });
          added++;
        }
      });
      save();
      renderContactList();
      if (added) alert(`${added} contact(s) added!`);
      else alert('Contacts already exist.');
    } catch (e) {
      manualAdd();
    }
  } else {
    manualAdd();
  }
}

function manualAdd() {
  const name = prompt('Enter contact name:');
  if (!name) return;
  const phone = prompt('Enter phone number (for SMS):');
  const exists = contacts.find(c => c.name.toLowerCase() === name.trim().toLowerCase());
  if (exists) { alert('Contact already exists!'); return; }
  contacts.unshift({ id: Date.now().toString(), name: name.trim(), phone: phone?.trim() || '', transactions: [] });
  save();
  renderContactList();
}

document.getElementById('search-input').addEventListener('input', e => renderContactList(e.target.value));

// Initial render
renderContactList();

// Add some demo data if empty
if (!contacts.length) {
  const demo = [
    { id: '1', name: 'Ramesh Kumar', phone: '9876543210', transactions: [
      { type: 'due', amount: 5000, note: 'Shop goods', ts: Date.now() - 86400000 * 3 },
      { type: 'paid', amount: 2000, note: '', ts: Date.now() - 86400000 }
    ]},
    { id: '2', name: 'Suresh Babu', phone: '9123456780', transactions: [
      { type: 'due', amount: 1500, note: 'Advance', ts: Date.now() - 86400000 * 7 }
    ]},
    { id: '3', name: 'Lakshmi Devi', phone: '', transactions: [
      { type: 'due', amount: 800, note: '', ts: Date.now() - 86400000 * 2 },
      { type: 'paid', amount: 800, note: '', ts: Date.now() - 3600000 }
    ]}
  ];
  contacts = demo;
  save();
  renderContactList();
}
</script>
</body>
</html>
