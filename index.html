<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Bhanu Kiranam</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --green: #16a34a; --green-light: #dcfce7; --green-dark: #14532d;
  --red: #dc2626; --red-light: #fee2e2; --red-dark: #7f1d1d;
  --bg: #f0fdf4; --card: #ffffff; --border: #e5e7eb;
  --text: #111827; --muted: #6b7280;
}
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; max-width: 480px; margin: 0 auto; }

/* PIN */
#pin-screen { position: fixed; inset: 0; background: var(--green); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; padding: 40px 20px; }
#pin-screen.hidden { display: none; }
.pin-logo { font-size: 56px; margin-bottom: 8px; }
.pin-title { color: white; font-size: 26px; font-weight: 800; margin-bottom: 6px; }
.pin-subtitle { color: rgba(255,255,255,0.75); font-size: 15px; margin-bottom: 40px; }
.pin-setup-label { color: rgba(255,255,255,0.85); font-size: 14px; margin-bottom: 16px; }
.pin-dots { display: flex; gap: 16px; margin-bottom: 36px; }
.pin-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.6); background: transparent; transition: background 0.15s; }
.pin-dot.filled { background: white; border-color: white; }
.pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; max-width: 300px; }
.pin-btn { background: rgba(255,255,255,0.15); border: none; border-radius: 50%; width: 72px; height: 72px; color: white; font-size: 24px; font-weight: 600; cursor: pointer; margin: 0 auto; display: flex; align-items: center; justify-content: center; transition: background 0.1s; }
.pin-btn:active { background: rgba(255,255,255,0.35); }
.pin-error { color: #fca5a5; font-size: 14px; margin-top: 16px; min-height: 20px; }

/* TOP BAR */
.topbar { background: var(--green); padding: 14px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
.topbar-title { color: white; font-size: 20px; font-weight: 700; flex: 1; }
.icon-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* SEARCH */
.search-wrap { padding: 10px 16px; background: white; border-bottom: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; }
.search-input { flex: 1; min-width: 100px; border: 1.5px solid var(--border); border-radius: 24px; padding: 10px 14px; font-size: 15px; outline: none; background: #f9fafb; }
.search-input:focus { border-color: var(--green); background: white; }
.btn-green { background: var(--green); color: white; border: none; border-radius: 24px; padding: 10px 12px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn-outline { background: white; color: var(--green); border: 1.5px solid var(--green); border-radius: 24px; padding: 10px 12px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }

/* SUMMARY */
.summary-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 16px; }
.summary-card { border-radius: 12px; padding: 12px 14px; }
.summary-card.due { background: var(--red-light); }
.summary-card.recv { background: var(--green-light); }
.s-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
.s-amount { font-size: 22px; font-weight: 800; margin-top: 2px; }
.summary-card.due .s-amount { color: var(--red); }
.summary-card.recv .s-amount { color: var(--green); }

/* CONTACT LIST */
.contact-list { padding: 4px 16px 100px; display: flex; flex-direction: column; gap: 10px; }
.contact-card { background: var(--card); border-radius: 14px; border: 1px solid var(--border); padding: 14px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; }
.contact-card:active { background: #f9fafb; }
.avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; flex-shrink: 0; }
.contact-info { flex: 1; min-width: 0; }
.contact-name { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.contact-phone { font-size: 13px; color: var(--muted); margin-top: 2px; }
.contact-balance { text-align: right; flex-shrink: 0; }
.bal-amount { font-weight: 700; font-size: 16px; }
.bal-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
.c-red { color: var(--red); }
.c-green { color: var(--green); }

/* EMPTY */
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-icon { font-size: 56px; margin-bottom: 12px; }
.empty h3 { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 6px; }

/* FAB */
.fab { position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px; border-radius: 50%; background: var(--green); color: white; border: none; font-size: 30px; cursor: pointer; box-shadow: 0 4px 16px rgba(22,163,74,0.4); display: flex; align-items: center; justify-content: center; z-index: 200; }
.fab:active { transform: scale(0.93); }

/* OVERLAY / SHEET */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 400; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.overlay.open { opacity: 1; pointer-events: all; }
.sheet { background: white; border-radius: 24px 24px 0 0; width: 100%; max-width: 480px; padding: 20px 20px 40px; max-height: 92vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.25s cubic-bezier(.4,0,.2,1); }
.overlay.open .sheet { transform: translateY(0); }
.sheet-handle { width: 40px; height: 4px; background: #d1d5db; border-radius: 2px; margin: 0 auto 18px; }
.sheet-title { font-size: 20px; font-weight: 700; margin-bottom: 18px; }

/* FORM */
.form-group { margin-bottom: 15px; }
.form-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
.form-input { width: 100%; border: 1.5px solid var(--border); border-radius: 12px; padding: 12px 14px; font-size: 16px; outline: none; background: #f9fafb; }
.form-input:focus { border-color: var(--green); background: white; }
.type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.type-btn { border: 2px solid var(--border); border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; background: white; color: var(--muted); text-align: center; }
.type-btn.due.active { border-color: var(--red); background: var(--red-light); color: var(--red-dark); }
.type-btn.paid.active { border-color: var(--green); background: var(--green-light); color: var(--green-dark); }
.submit-btn { width: 100%; padding: 15px; border-radius: 14px; border: none; font-size: 16px; font-weight: 700; color: white; cursor: pointer; margin-top: 6px; }
.submit-btn.due { background: var(--red); }
.submit-btn.paid { background: var(--green); }
.submit-btn:disabled { background: #9ca3af; cursor: not-allowed; }

/* PHOTO SECTION */
.photo-add-row { display: flex; gap: 10px; margin-bottom: 10px; }
.photo-source-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 1.5px dashed var(--border); border-radius: 12px; padding: 14px 8px; background: #f9fafb; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
.photo-source-btn:active { background: #f0fdf4; border-color: var(--green); color: var(--green); }
.photo-source-btn .ico { font-size: 24px; }
.photo-count-badge { font-size: 12px; color: var(--green); font-weight: 600; margin-bottom: 6px; min-height: 18px; }
.photo-preview-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.photo-thumb-wrap { position: relative; width: 72px; height: 72px; }
.photo-thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); cursor: pointer; display: block; }
.photo-del-btn { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--red); border: 2px solid white; color: white; font-size: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: 700; line-height: 1; }
.photo-loading { font-size: 13px; color: var(--muted); padding: 8px 0; }

/* DETAIL PAGE */
#detail-page { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 150; overflow-y: auto; max-width: 480px; margin: 0 auto; }
#detail-page.open { display: block; }
.detail-topbar { background: white; border-bottom: 1px solid var(--border); padding: 14px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
.detail-avatar { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; flex-shrink: 0; }
.det-name { font-size: 17px; font-weight: 700; }
.det-phone { font-size: 13px; color: var(--muted); }
.balance-banner { margin: 14px 16px; border-radius: 16px; padding: 18px; text-align: center; }
.balance-banner.owed-bg { background: var(--red-light); }
.balance-banner.clear-bg { background: var(--green-light); }
.big-amt { font-size: 34px; font-weight: 800; }
.big-label { font-size: 14px; color: var(--muted); margin-top: 4px; }
.action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 16px 12px; }
.action-btn { padding: 13px; border-radius: 14px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; }
.action-btn.due { background: var(--red-light); color: var(--red-dark); }
.action-btn.paid { background: var(--green-light); color: var(--green-dark); }
.comm-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 16px 14px; }
.comm-btn { padding: 12px; border-radius: 14px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; display: block; }
.comm-btn.sms { background: #1d4ed8; color: white; }
.comm-btn.wa { background: #25d366; color: white; }
.sec-title { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; margin: 0 16px 8px; }

/* TRANSACTION CARDS */
.txn-list { margin: 0 16px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 100px; }
.txn-card { background: white; border-radius: 14px; border: 1px solid var(--border); padding: 13px 14px; }
.txn-top { display: flex; align-items: flex-start; gap: 10px; }
.txn-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
.txn-dot.due { background: var(--red); }
.txn-dot.paid { background: var(--green); }
.txn-info { flex: 1; }
.txn-type { font-weight: 600; font-size: 14px; }
.txn-note { font-size: 13px; color: var(--muted); margin-top: 1px; }
.txn-date { font-size: 12px; color: var(--muted); margin-top: 2px; }
.txn-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.txn-amt { font-weight: 700; font-size: 15px; }
.txn-amt.due { color: var(--red); }
.txn-amt.paid { color: var(--green); }
.del-btn { background: none; border: none; color: #d1d5db; font-size: 16px; cursor: pointer; padding: 2px 4px; }
.del-btn:active { color: var(--red); }
.txn-photos { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
.txn-photo { width: 68px; height: 68px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; }

/* LIGHTBOX */
#lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 900; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
#lightbox.open { display: flex; }
#lightbox img { max-width: 100%; max-height: 78vh; border-radius: 10px; object-fit: contain; }
.lb-close { position: absolute; top: 18px; right: 18px; background: rgba(255,255,255,0.15); border: none; color: white; font-size: 24px; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.lb-nav { display: flex; gap: 16px; margin-top: 14px; }
.lb-nav button { background: rgba(255,255,255,0.15); border: none; color: white; font-size: 26px; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.lb-counter { color: rgba(255,255,255,0.65); font-size: 14px; margin-top: 8px; }

/* EXPORT */
.export-options { display: flex; flex-direction: column; gap: 10px; }
.export-opt { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 14px; border: 1.5px solid var(--border); cursor: pointer; background: white; width: 100%; text-align: left; }
.export-opt:active { background: #f9fafb; }
.export-icon { font-size: 30px; flex-shrink: 0; }
.export-title { font-weight: 600; font-size: 15px; }
.export-desc { font-size: 13px; color: var(--muted); margin-top: 2px; }

/* STORAGE WARNING */
.storage-bar-wrap { margin: 0 16px 12px; }
.storage-bar-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
.storage-bar-bg { height: 6px; background: #e5e7eb; border-radius: 3px; }
.storage-bar-fill { height: 6px; border-radius: 3px; background: var(--green); transition: width 0.3s; }
.storage-bar-fill.warn { background: #f59e0b; }
.storage-bar-fill.danger { background: var(--red); }
</style>
</head>
<body>

<!-- PIN -->
<div id="pin-screen">
  <div class="pin-logo">📒</div>
  <div class="pin-title">Bhanu Kiranam</div>
  <div class="pin-subtitle" id="pin-subtitle">Enter your PIN</div>
  <div class="pin-setup-label" id="pin-setup-label"></div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-pad">
    <button class="pin-btn" onclick="pinPress('1')">1</button>
    <button class="pin-btn" onclick="pinPress('2')">2</button>
    <button class="pin-btn" onclick="pinPress('3')">3</button>
    <button class="pin-btn" onclick="pinPress('4')">4</button>
    <button class="pin-btn" onclick="pinPress('5')">5</button>
    <button class="pin-btn" onclick="pinPress('6')">6</button>
    <button class="pin-btn" onclick="pinPress('7')">7</button>
    <button class="pin-btn" onclick="pinPress('8')">8</button>
    <button class="pin-btn" onclick="pinPress('9')">9</button>
    <button class="pin-btn"></button>
    <button class="pin-btn" onclick="pinPress('0')">0</button>
    <button class="pin-btn" onclick="pinDel()">⌫</button>
  </div>
  <div class="pin-error" id="pin-error"></div>
</div>

<!-- MAIN -->
<div id="main-page" style="display:none">
  <div class="topbar">
    <div class="topbar-title">📒 Bhanu Kiranam</div>
    <button class="icon-btn" onclick="openExport()">⬇</button>
    <button class="icon-btn" onclick="lockApp()">🔒</button>
  </div>
  <div class="search-wrap">
    <input class="search-input" id="search-input" type="search" placeholder="Search contacts..." autocomplete="off">
    <button class="btn-green" onclick="importContacts()">📱 Import</button>
    <button class="btn-outline" onclick="openManualModal()">✏️ Manual</button>
  </div>
  <div class="summary-bar">
    <div class="summary-card due"><div class="s-label">Total Due</div><div class="s-amount" id="total-due">₹0</div></div>
    <div class="summary-card recv"><div class="s-label">Total Received</div><div class="s-amount" id="total-recv">₹0</div></div>
  </div>
  <div class="storage-bar-wrap" id="storage-bar-wrap" style="display:none">
    <div class="storage-bar-label"><span>Storage used</span><span id="storage-pct"></span></div>
    <div class="storage-bar-bg"><div class="storage-bar-fill" id="storage-fill"></div></div>
  </div>
  <div class="contact-list" id="contact-list"></div>
</div>

<!-- DETAIL -->
<div id="detail-page">
  <div class="detail-topbar">
    <button class="icon-btn" style="background:#f3f4f6;color:#374151;" onclick="closePage()">←</button>
    <div class="detail-avatar" id="det-avatar"></div>
    <div style="flex:1;min-width:0">
      <div class="det-name" id="det-name"></div>
      <div class="det-phone" id="det-phone"></div>
    </div>
    <button class="icon-btn" style="background:#fee2e2;color:#991b1b;" onclick="deleteContact()">🗑</button>
  </div>
  <div class="balance-banner" id="det-banner">
    <div class="big-amt" id="det-amount"></div>
    <div class="big-label" id="det-label"></div>
  </div>
  <div class="action-row">
    <button class="action-btn due" onclick="openTxnModal('due')">+ Add Due</button>
    <button class="action-btn paid" onclick="openTxnModal('paid')">✓ Add Paid</button>
  </div>
  <div class="comm-row">
    <a class="comm-btn sms" id="sms-link" href="#">📱 SMS</a>
    <a class="comm-btn wa" id="wa-link" href="#" target="_blank">💬 WhatsApp</a>
  </div>
  <div class="sec-title">Transaction History</div>
  <div class="txn-list" id="txn-list"></div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <button class="lb-close" onclick="closeLightbox()">✕</button>
  <img id="lb-img" src="" alt="photo">
  <div class="lb-nav">
    <button onclick="lbNav(-1)">‹</button>
    <button onclick="lbNav(1)">›</button>
  </div>
  <div class="lb-counter" id="lb-counter"></div>
</div>

<!-- FAB -->
<button class="fab" onclick="openTxnModal('due')">+</button>

<!-- TXN MODAL -->
<div class="overlay" id="txn-overlay" onclick="handleOverlay(event,'txn-overlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="txn-sheet-title">Add Transaction</div>

    <div class="form-group">
      <label class="form-label">Type</label>
      <div class="type-toggle">
        <button class="type-btn due active" id="type-due" onclick="setType('due')">🔴 Due (Owes You)</button>
        <button class="type-btn paid" id="type-paid" onclick="setType('paid')">🟢 Paid (Received)</button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Amount (₹) *</label>
      <input class="form-input" id="txn-amount" type="number" inputmode="decimal" placeholder="Enter amount" autocomplete="off">
    </div>

    <div class="form-group">
      <label class="form-label">Note (optional)</label>
      <input class="form-input" id="txn-note" type="text" placeholder="e.g. Groceries, Loan..." autocomplete="off">
    </div>

    <div class="form-group">
      <label class="form-label">Photos (optional)</label>
      <div class="photo-add-row">
        <label class="photo-source-btn" for="photo-camera">
          <span class="ico">📷</span>Camera
        </label>
        <label class="photo-source-btn" for="photo-gallery">
          <span class="ico">🖼️</span>Gallery
        </label>
      </div>
      <div class="photo-count-badge" id="photo-count-badge"></div>
      <div class="photo-preview-grid" id="photo-preview"></div>
      <div class="photo-loading" id="photo-loading" style="display:none">⏳ Processing photo...</div>
    </div>

    <!-- Hidden file inputs OUTSIDE the sheet to prevent form interference -->
    <button class="submit-btn due" id="submit-btn" onclick="submitTxn()">🔴 Add Due Amount</button>
  </div>
</div>

<!-- File inputs outside modal to avoid Android Chrome sheet-close bug -->
<input type="file" id="photo-camera" accept="image/*" capture="environment" style="display:none" multiple>
<input type="file" id="photo-gallery" accept="image/*" style="display:none" multiple>

<!-- MANUAL MODAL -->
<div class="overlay" id="manual-overlay" onclick="handleOverlay(event,'manual-overlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Add Contact Manually</div>
    <div class="form-group">
      <label class="form-label">Full Name</label>
      <input class="form-input" id="manual-name" type="text" placeholder="e.g. Ramesh Kumar" autocomplete="off">
    </div>
    <div class="form-group">
      <label class="form-label">Phone Number</label>
      <input class="form-input" id="manual-phone" type="tel" inputmode="numeric" placeholder="e.g. 9876543210">
    </div>
    <button class="submit-btn paid" onclick="submitManual()">✓ Add Contact</button>
  </div>
</div>

<!-- EXPORT MODAL -->
<div class="overlay" id="export-overlay" onclick="handleOverlay(event,'export-overlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Export Data</div>
    <div class="export-options">
      <button class="export-opt" onclick="exportExcel()">
        <div class="export-icon">📊</div>
        <div><div class="export-title">Export as Excel (.xlsx)</div><div class="export-desc">All contacts and transactions</div></div>
      </button>
      <button class="export-opt" onclick="exportCSV()">
        <div class="export-icon">📄</div>
        <div><div class="export-title">Export as CSV</div><div class="export-desc">Open in Excel, Google Sheets, etc.</div></div>
      </button>
      <button class="export-opt" onclick="exportSummaryPrint()">
        <div class="export-icon">🖨️</div>
        <div><div class="export-title">Print / Save as PDF</div><div class="export-desc">Summary of all balances</div></div>
      </button>
    </div>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────
let contacts = JSON.parse(localStorage.getItem('bhanu_contacts') || '[]');
let currentContactId = null;
let currentType = 'due';
let pendingPhotos = []; // compressed base64 strings
let lbPhotos = [], lbIndex = 0;

function save() {
  try {
    localStorage.setItem('bhanu_contacts', JSON.stringify(contacts));
    updateStorageBar();
  } catch(e) {
    alert('Storage full! Please export your data and delete some old photos to free up space.');
  }
}

function getBalance(c) { return (c.transactions||[]).reduce((s,t)=>t.type==='paid'?s-t.amount:s+t.amount,0); }
function getInitials(n) { return n.trim().split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }
const COLORS=['#16a34a','#2563eb','#7c3aed','#db2777','#ea580c','#0891b2','#65a30d','#b45309'];
function getColor(n){let h=0;for(let c of n)h=(h*31+c.charCodeAt(0))%COLORS.length;return COLORS[h];}
function fmtNum(n){return Math.round(Math.abs(n)).toLocaleString('en-IN');}
function fmtDate(ts){return new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'});}

// ── STORAGE BAR ───────────────────────────────────────
function updateStorageBar() {
  try {
    const used = new Blob(Object.values(localStorage)).size;
    const max = 5 * 1024 * 1024; // 5MB estimate
    const pct = Math.min(100, Math.round((used / max) * 100));
    const wrap = document.getElementById('storage-bar-wrap');
    if (pct > 20) {
      wrap.style.display = 'block';
      document.getElementById('storage-pct').textContent = pct + '% used';
      const fill = document.getElementById('storage-fill');
      fill.style.width = pct + '%';
      fill.className = 'storage-bar-fill' + (pct > 80 ? ' danger' : pct > 50 ? ' warn' : '');
    } else {
      wrap.style.display = 'none';
    }
  } catch(e) {}
}

// ── PHOTO COMPRESSION ─────────────────────────────────
// Compresses image to max 800px wide, JPEG quality 0.6 → ~40-80KB per photo
function compressImage(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const MAX = 800;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ── PIN ───────────────────────────────────────────────
const SAVED_PIN = () => localStorage.getItem('bhanu_pin');
let pinBuffer='', pinStep='enter', pinTemp='';

function initPin() {
  if (!SAVED_PIN()) {
    pinStep='setup1';
    document.getElementById('pin-subtitle').textContent='Set up your PIN';
    document.getElementById('pin-setup-label').textContent='Choose a 4-digit PIN for security';
  }
}
function pinPress(d) {
  if (!d || pinBuffer.length >= 4) return;
  pinBuffer += d; updateDots();
  if (pinBuffer.length === 4) setTimeout(checkPin, 120);
}
function pinDel() { pinBuffer=pinBuffer.slice(0,-1); updateDots(); document.getElementById('pin-error').textContent=''; }
function updateDots() { for(let i=0;i<4;i++) document.getElementById('d'+i).className='pin-dot'+(i<pinBuffer.length?' filled':''); }
function checkPin() {
  if (pinStep==='setup1') {
    pinTemp=pinBuffer; pinBuffer=''; updateDots(); pinStep='setup2';
    document.getElementById('pin-subtitle').textContent='Confirm your PIN';
    document.getElementById('pin-setup-label').textContent='Enter the same PIN again';
    return;
  }
  if (pinStep==='setup2') {
    if (pinBuffer===pinTemp) { localStorage.setItem('bhanu_pin',pinBuffer); unlockApp(); }
    else {
      document.getElementById('pin-error').textContent='PINs do not match. Try again.';
      pinBuffer=''; pinTemp=''; pinStep='setup1'; updateDots();
      document.getElementById('pin-subtitle').textContent='Set up your PIN';
      document.getElementById('pin-setup-label').textContent='Choose a 4-digit PIN';
    }
    return;
  }
  if (pinBuffer===SAVED_PIN()) unlockApp();
  else { document.getElementById('pin-error').textContent='Wrong PIN. Try again.'; pinBuffer=''; updateDots(); }
}
function unlockApp() {
  document.getElementById('pin-screen').classList.add('hidden');
  document.getElementById('main-page').style.display='block';
  renderList(); updateStorageBar();
}
function lockApp() {
  pinBuffer=''; pinStep='enter'; updateDots();
  document.getElementById('pin-error').textContent='';
  document.getElementById('pin-subtitle').textContent='Enter your PIN';
  document.getElementById('pin-setup-label').textContent='';
  document.getElementById('pin-screen').classList.remove('hidden');
  document.getElementById('main-page').style.display='none';
  document.getElementById('detail-page').classList.remove('open');
}

// ── LIST ──────────────────────────────────────────────
function renderList(filter='') {
  const list=document.getElementById('contact-list');
  const f=filter.toLowerCase();
  const filtered=contacts.filter(c=>c.name.toLowerCase().includes(f)||(c.phone&&c.phone.includes(f)));
  let due=0, recv=0;
  contacts.forEach(c=>{const b=getBalance(c);if(b>0)due+=b;else recv+=Math.abs(b);});
  document.getElementById('total-due').textContent='₹'+fmtNum(due);
  document.getElementById('total-recv').textContent='₹'+fmtNum(recv);
  if (!contacts.length) { list.innerHTML=`<div class="empty"><div class="empty-icon">📖</div><h3>No contacts yet</h3><p>Tap "📱 Import" or "✏️ Manual" to add someone.</p></div>`; return; }
  if (!filtered.length) { list.innerHTML=`<div class="empty"><div class="empty-icon">🔍</div><h3>No results found</h3></div>`; return; }
  list.innerHTML=filtered.map(c=>{
    const bal=getBalance(c), color=getColor(c.name);
    return `<div class="contact-card" onclick="openContact('${c.id}')">
      <div class="avatar" style="background:${color}22;color:${color}">${getInitials(c.name)}</div>
      <div class="contact-info"><div class="contact-name">${c.name}</div><div class="contact-phone">${c.phone||'No phone'}</div></div>
      <div class="contact-balance">
        <div class="bal-amount ${bal>0?'c-red':'c-green'}">₹${fmtNum(bal)}</div>
        <div class="bal-label">${bal>0?'owes you':bal<0?'you owe':'settled'}</div>
      </div>
    </div>`;
  }).join('');
}

// ── DETAIL ────────────────────────────────────────────
function openContact(id) {
  currentContactId=id;
  const c=contacts.find(x=>x.id===id); if (!c) return;
  const bal=getBalance(c), color=getColor(c.name);
  document.getElementById('det-avatar').textContent=getInitials(c.name);
  document.getElementById('det-avatar').style.cssText=`background:${color}22;color:${color}`;
  document.getElementById('det-name').textContent=c.name;
  document.getElementById('det-phone').textContent=c.phone||'No phone saved';
  const amtEl=document.getElementById('det-amount'), lblEl=document.getElementById('det-label'), banner=document.getElementById('det-banner');
  amtEl.textContent='₹'+fmtNum(bal);
  if (bal>0) { banner.className='balance-banner owed-bg'; amtEl.style.color='var(--red)'; lblEl.textContent=c.name+' owes you'; }
  else if (bal<0) { banner.className='balance-banner'; amtEl.style.color='#b45309'; lblEl.textContent='You owe '+c.name; }
  else { banner.className='balance-banner clear-bg'; amtEl.style.color='var(--green)'; lblEl.textContent='All settled! ✓'; }
  const msg=buildMsg(c,bal), ph=c.phone||'';
  document.getElementById('sms-link').href=ph?`sms:${ph}?body=${encodeURIComponent(msg)}`:'#';
  document.getElementById('wa-link').href=ph?`https://wa.me/91${ph.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`:'#';
  renderTxns(c);
  document.getElementById('detail-page').classList.add('open');
}
function buildMsg(c,bal) {
  const a=fmtNum(bal);
  if (bal>0) return `Hi ${c.name}, your pending due is ₹${a}. Please settle at your earliest. - Bhanu Kiranam`;
  if (bal<0) return `Hi ${c.name}, we owe you ₹${a}. We will settle soon. - Bhanu Kiranam`;
  return `Hi ${c.name}, your account is fully settled. Thank you! - Bhanu Kiranam`;
}
function renderTxns(c) {
  const list=document.getElementById('txn-list');
  const txns=[...(c.transactions||[])].reverse();
  if (!txns.length) { list.innerHTML='<div style="text-align:center;padding:30px;color:#9ca3af;">No transactions yet</div>'; return; }
  list.innerHTML=txns.map((t,ri)=>{
    const realIdx=c.transactions.length-1-ri;
    const photos=(t.photos||[]).map((p,pi)=>`<img class="txn-photo" src="${p}" onclick="openLightbox('${c.id}',${realIdx},${pi})" alt="photo">`).join('');
    const photoCount=(t.photos||[]).length;
    return `<div class="txn-card">
      <div class="txn-top">
        <div class="txn-dot ${t.type}"></div>
        <div class="txn-info">
          <div class="txn-type">${t.type==='due'?'Due Added':'Payment Received'}</div>
          ${t.note?`<div class="txn-note">${t.note}</div>`:''}
          <div class="txn-date">${fmtDate(t.ts)}${photoCount?` · 📷 ${photoCount}`:''}</div>
        </div>
        <div class="txn-right">
          <div class="txn-amt ${t.type}">₹${t.amount.toLocaleString('en-IN')}</div>
          <button class="del-btn" onclick="deleteTxn('${c.id}',${realIdx})">✕</button>
        </div>
      </div>
      ${photos?`<div class="txn-photos">${photos}</div>`:''}
    </div>`;
  }).join('');
}
function closePage() { document.getElementById('detail-page').classList.remove('open'); renderList(document.getElementById('search-input').value); }
function deleteContact() {
  const c=contacts.find(x=>x.id===currentContactId);
  if (!c||!confirm(`Delete ${c.name} and all their data?`)) return;
  contacts=contacts.filter(x=>x.id!==currentContactId); save(); closePage();
}
function deleteTxn(cid,idx) {
  if (!confirm('Delete this transaction?')) return;
  const c=contacts.find(x=>x.id===cid);
  if (c) { c.transactions.splice(idx,1); save(); openContact(cid); }
}

// ── LIGHTBOX ──────────────────────────────────────────
function openLightbox(cid,txnIdx,photoIdx) {
  const c=contacts.find(x=>x.id===cid); if (!c) return;
  lbPhotos=c.transactions[txnIdx].photos||[]; lbIndex=photoIdx;
  showLbPhoto(); document.getElementById('lightbox').classList.add('open');
}
function openPendingLightbox(i) { lbPhotos=[...pendingPhotos]; lbIndex=i; showLbPhoto(); document.getElementById('lightbox').classList.add('open'); }
function showLbPhoto() {
  document.getElementById('lb-img').src=lbPhotos[lbIndex];
  const nav=document.querySelector('.lb-nav');
  nav.style.display=lbPhotos.length>1?'flex':'none';
  document.getElementById('lb-counter').textContent=lbPhotos.length>1?`${lbIndex+1} / ${lbPhotos.length}`:'';
}
function lbNav(dir) { if(lbPhotos.length<2)return; lbIndex=(lbIndex+dir+lbPhotos.length)%lbPhotos.length; showLbPhoto(); }
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }

// ── PHOTO HANDLING ────────────────────────────────────
async function handlePhotoInput(files) {
  if (!files.length) return;
  const loadingEl = document.getElementById('photo-loading');
  loadingEl.style.display = 'block';
  // Save amount/note values before async work
  const savedAmount = document.getElementById('txn-amount').value;
  const savedNote = document.getElementById('txn-note').value;

  for (const file of Array.from(files)) {
    const compressed = await compressImage(file);
    pendingPhotos.push(compressed);
  }

  // Restore values in case Android reset them
  document.getElementById('txn-amount').value = savedAmount;
  document.getElementById('txn-note').value = savedNote;

  loadingEl.style.display = 'none';
  renderPhotoPreview();
}

function renderPhotoPreview() {
  const count = pendingPhotos.length;
  document.getElementById('photo-count-badge').textContent = count ? `${count} photo${count>1?'s':''} added` : '';
  document.getElementById('photo-preview').innerHTML = pendingPhotos.map((p,i)=>`
    <div class="photo-thumb-wrap">
      <img class="photo-thumb" src="${p}" onclick="openPendingLightbox(${i})">
      <div class="photo-del-btn" onclick="removePendingPhoto(${i})">✕</div>
    </div>`).join('');
}
function removePendingPhoto(i) { pendingPhotos.splice(i,1); renderPhotoPreview(); }

// ── TXN MODAL ─────────────────────────────────────────
function openTxnModal(type) {
  pendingPhotos=[];
  document.getElementById('photo-preview').innerHTML='';
  document.getElementById('photo-count-badge').textContent='';
  document.getElementById('photo-loading').style.display='none';
  setType(type);
  document.getElementById('txn-amount').value='';
  document.getElementById('txn-note').value='';
  document.getElementById('txn-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('txn-amount').focus(),350);
}
function handleOverlay(e,id) { if(e.target===document.getElementById(id)) document.getElementById(id).classList.remove('open'); }
function setType(t) {
  currentType=t;
  document.getElementById('type-due').className='type-btn due'+(t==='due'?' active':'');
  document.getElementById('type-paid').className='type-btn paid'+(t==='paid'?' active':'');
  const btn=document.getElementById('submit-btn');
  btn.className=`submit-btn ${t}`;
  btn.textContent=t==='due'?'🔴 Add Due Amount':'🟢 Record Payment';
}
function submitTxn() {
  const amountStr=document.getElementById('txn-amount').value.trim();
  const amount=parseFloat(amountStr);
  const note=document.getElementById('txn-note').value.trim();
  if (!amountStr || isNaN(amount) || amount<=0) { alert('Please enter a valid amount first.'); document.getElementById('txn-amount').focus(); return; }

  let cid=currentContactId;
  if (!cid) {
    const name=prompt('Enter contact name:'); if (!name) return;
    const phone=prompt('Phone number (for SMS):');
    const id=Date.now()+'';
    contacts.unshift({id,name:name.trim(),phone:phone?.trim()||'',transactions:[]});
    cid=id; currentContactId=id;
  }
  const c=contacts.find(x=>x.id===cid);
  if (!c.transactions) c.transactions=[];
  c.transactions.push({type:currentType, amount, note, photos:[...pendingPhotos], ts:Date.now()});
  save();
  document.getElementById('txn-overlay').classList.remove('open');

  if (c.phone) {
    const bal=getBalance(c), msg=buildMsg(c,bal);
    const a=document.createElement('a'); a.href=`sms:${c.phone}?body=${encodeURIComponent(msg)}`; a.click();
  }
  if (document.getElementById('detail-page').classList.contains('open')) openContact(cid);
  else renderList();
}

// ── MANUAL ────────────────────────────────────────────
function openManualModal() {
  document.getElementById('manual-name').value='';
  document.getElementById('manual-phone').value='';
  document.getElementById('manual-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('manual-name').focus(),300);
}
function submitManual() {
  const name=document.getElementById('manual-name').value.trim();
  const phone=document.getElementById('manual-phone').value.trim();
  if (!name) { alert('Please enter a name.'); return; }
  if (contacts.find(c=>c.name.toLowerCase()===name.toLowerCase())) { alert(`"${name}" already exists.`); return; }
  contacts.unshift({id:Date.now()+'', name, phone, transactions:[]});
  save(); document.getElementById('manual-overlay').classList.remove('open'); renderList();
}

// ── IMPORT ────────────────────────────────────────────
async function importContacts() {
  if ('contacts' in navigator && 'ContactsManager' in window) {
    try {
      const res=await navigator.contacts.select(['name','tel'],{multiple:true});
      if (!res.length) return;
      let added=0;
      res.forEach(r=>{
        const name=r.name?.[0]||'Unknown', phone=r.tel?.[0]?.replace(/\s/g,'')||'';
        if (!contacts.find(c=>c.name.toLowerCase()===name.toLowerCase()||(phone&&c.phone===phone))) {
          contacts.push({id:Date.now()+Math.random()+'', name, phone, transactions:[]}); added++;
        }
      });
      save(); renderList(); alert(added?`${added} contact(s) added!`:'Already exist.'); return;
    } catch(e) {}
  }
  openManualModal();
}

// ── EXPORT ────────────────────────────────────────────
function openExport() { document.getElementById('export-overlay').classList.add('open'); }
function exportExcel() {
  const wb=XLSX.utils.book_new();
  const sd=[['Name','Phone','Total Due','Total Paid','Net Balance']];
  contacts.forEach(c=>{const txns=c.transactions||[];const due=txns.filter(t=>t.type==='due').reduce((s,t)=>s+t.amount,0);const paid=txns.filter(t=>t.type==='paid').reduce((s,t)=>s+t.amount,0);sd.push([c.name,c.phone||'',due,paid,due-paid]);});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sd),'Summary');
  const td=[['Contact','Phone','Type','Amount','Note','Photos','Date']];
  contacts.forEach(c=>{(c.transactions||[]).forEach(t=>{td.push([c.name,c.phone||'',t.type==='due'?'Due':'Paid',t.amount,t.note||'',(t.photos||[]).length+' photo(s)',new Date(t.ts).toLocaleString('en-IN')]);});});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(td),'All Transactions');
  XLSX.writeFile(wb,`BhanuKiranam_${new Date().toLocaleDateString('en-IN').replace(/\//g,'-')}.xlsx`);
  document.getElementById('export-overlay').classList.remove('open');
}
function exportCSV() {
  const rows=[['Name','Phone','Type','Amount','Note','Photos','Date']];
  contacts.forEach(c=>{(c.transactions||[]).forEach(t=>{rows.push([c.name,c.phone||'',t.type,t.amount,t.note||'',(t.photos||[]).length,new Date(t.ts).toLocaleString('en-IN')]);});});
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`BhanuKiranam_${new Date().toLocaleDateString('en-IN').replace(/\//g,'-')}.csv`; a.click();
  document.getElementById('export-overlay').classList.remove('open');
}
function exportSummaryPrint() {

  const win=window.open('','_blank'); win.document.write(html); win.document.close();
}
